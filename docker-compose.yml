services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - '5432:5432'
    volumes:
      # Postgres 18 images keep data in a versioned subdirectory under /var/lib/postgresql;
      # a fresh volume, since a 16 data directory can't be opened by 18 (see README)
      - pgdata18:/var/lib/postgresql
  keycloak:
    image: quay.io/keycloak/keycloak:26.8
    command: ['start-dev', '--import-realm']
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
    ports:
      - '8080:8080'
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
  sonarqube:
    image: sonarqube:community
    ports:
      - '19000:9000'
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
volumes:
  pgdata: # Postgres 16 data, no longer mounted; kept for rollback until removed by hand
  pgdata18:
  keycloak_data:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
